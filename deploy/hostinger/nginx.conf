# Auslieferung des Flutter-Web-Builds von Lerndex (app.lerndex.de).
# Vorlage: fahrsignal. "www" ist ein RELATIVER Symlink auf releases/<stand>.

# Cache-Regeln als map: ein add_header in einer location würde alle
# Kopfzeilen der server-Ebene ersetzen.
map $uri $lx_cache {
    # Immer nachfragen, per ETag mit 304 beantworten. Flutter hängt keine
    # Prüfsummen an Dateinamen (main.dart.js bleibt main.dart.js).
    default                        "public, max-age=0, must-revalidate";
    # Die Startkette gar nicht ablegen, sonst bleibt ein Deploy auf iPhones
    # tagelang unsichtbar.
    ~^/$                           "no-store";
    ~^/index\.html$                "no-store";
    ~^/flutter_bootstrap\.js$      "no-store";
    ~^/flutter_service_worker\.js$ "no-store";
    ~^/version\.json$              "no-store";
    ~^/manifest\.json$             "no-store";
}

server {
    listen 80;
    server_name _;

    root  /srv/www;
    index index.html;

    gzip              on;
    gzip_static       on;   # nimmt die vorkomprimierten .gz aus dem Build
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/wasm image/svg+xml font/ttf font/otf font/woff2;

    add_header Cache-Control           $lx_cache always;
    add_header X-Content-Type-Options  nosniff always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    # Kamera (Aufgaben-Fotos, QR) und Mikrofon (Spracheingabe) nur für die App
    add_header Permissions-Policy      "camera=(self), microphone=(self), geolocation=()" always;
    # Die App selbst gehört nicht in Suchmaschinen, die Webseite ist lerndex.de
    add_header X-Robots-Tag            "noindex, nofollow" always;

    # Die App hat eigene Pfade (/k/CODE, /s/TOKEN, /l/TOKEN, /e/CODE,
    # /schule/CODE): alles Unbekannte geht an index.html. Das =404 am Ende
    # verhindert eine Schleife, solange noch kein Release liegt.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Android App Links: Android prüft hier, ob die App die Links von
    # app.lerndex.de öffnen darf (Datei aus web/.well-known/). ^~ hat Vorrang
    # vor der Sperre für Punkt-Pfade darunter.
    location ^~ /.well-known/ {
        default_type application/json;
        try_files $uri =404;
    }

    location ~ /\. {
        deny all;
    }

    access_log off;
}
