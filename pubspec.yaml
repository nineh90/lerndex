name: lerndex
description: "Lernsoftware fuer Kinder"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0

  # Google Login
  google_sign_in: ^6.2.1

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase Core
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0

  # Firebase AI - Vertex AI (DSGVO-konform fuer Kinderdaten)
  # Einziger KI-Zugang der App. Alle Calls laufen ueber VertexAIService.
  # ENTFERNT: firebase_vertexai, google_generative_ai, flutter_dotenv
  firebase_ai: ^2.3.0

  # Foto-Upload
  image_picker: 1.0.7

  # Splash Screen
  flutter_native_splash: ^2.4.0

  # Crashlytics
  firebase_crashlytics: ^4.0.0

  # UI
  confetti: ^0.7.0
  fl_chart: ^0.69.0
  flutter_markdown: ^0.6.18

  # HTTP
  http: ^1.2.0

  # Code-Generatoren
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_tts: ^3.8.3

  flutter_math_fork: ^0.7.2

  # File system (genutzt in theme_picker_sheet.dart)
  path_provider: ^2.1.4
  path: ^1.9.0
  url_launcher: ^6.3.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code-Generatoren
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/images/