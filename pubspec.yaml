name: lerndex
description: "Lernsoftware fuer Kinder"
publish_to: 'none'

# +14: Version-Code 13 wurde von Google Play abgelehnt (Photo-Picker-Policy) –
# jeder neue Upload braucht einen höheren Code.
version: 1.1.4+14

environment:
  # Dart 3.12 = Flutter 3.44 (riverpod_generator 4 braucht analyzer 12 / meta 1.18)
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0

  # Google Login
  google_sign_in: ^6.2.1

  # Apple Login (Pflicht auf iOS, da Google-Login angeboten wird – Guideline 4.8)
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.3 # SHA256-Nonce für Sign in with Apple

  # State Management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Firebase Core
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  # 6.7.1 wird benoetigt, damit die gesamte Firebase-Familie auf
  # firebase_core_platform_interface 8.0.0 (Klasse FirebasePlugin) landet.
  # Die 7.1.0-Linie war intern kaputt (Plugins nutzen FirebasePlugin, deklarieren
  # aber ^7.1.0) und liess sich nicht konsistent aufloesen.
  # ACHTUNG: fake_cloud_firestore 4.1.1 kompiliert nicht gegen 6.7.x
  # (WriteBatch.update ist ab 6.7.0 generisch). Betroffene Tests sind vorerst
  # deaktiviert (siehe *.disabled) bis fake_cloud_firestore nachzieht.
  cloud_firestore: '>=6.7.1 <7.0.0'
  firebase_storage: ^13.0.0

  # Firebase AI - Vertex AI (DSGVO-konform fuer Kinderdaten)
  # Einziger KI-Zugang der App. Alle Calls laufen ueber VertexAIService.
  # ENTFERNT: firebase_vertexai, google_generative_ai, flutter_dotenv
  firebase_ai: ^3.14.0

  # Foto-Upload – Android-Implementierung direkt eingebunden, um den
  # System-Photo-Picker zu aktivieren (Play-Policy, s. main.dart)
  image_picker: ^1.1.2
  image_picker_android: ^0.8.13
  image_picker_platform_interface: ^2.10.0
  permission_handler: ^12.0.3

  # File system (genutzt in theme_picker_sheet.dart zur LAUFZEIT – nicht dev!)
  path_provider: ^2.1.4
  path: ^1.9.0

  # Splash Screen
  flutter_native_splash: ^2.4.0

  # Crashlytics
  firebase_crashlytics: ^5.0.0

  # UI
  confetti: ^0.8.0
  # Gepflegter Fork des discontinued flutter_markdown (gleiche API)
  flutter_markdown_plus: ^1.0.12

  # HTTP
  http: ^1.2.0

  flutter_tts: ^4.2.5
  speech_to_text: ^7.0.0

  flutter_math_fork: ^0.7.2

  # File system (genutzt in theme_picker_sheet.dart)
  url_launcher: ^6.3.2
  purchases_flutter: ^9.13.2
  purchases_ui_flutter: ^9.13.2

  # App-Version / Build-Nummer aus dem nativen Bundle lesen (für Feedback-Mails)
  package_info_plus: ^10.2.0

  # Lokalisierung (benötigt für deutschen DatePicker u.a.)
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # In-Memory Firestore-Fake fuer Unit-Tests (XP-, Streak-, Reward-Logik)
  fake_cloud_firestore: ^4.0.0

  # Code-Generatoren (nur Riverpod – Freezed/json_serializable werden
  # nicht mehr genutzt und wurden entfernt)
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/images/