name: lerndex
description: "Lernsoftware fuer Kinder"
publish_to: 'none'

version: 1.1.2+12

environment:
  sdk: '>=3.10.7 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0

  # Google Login
  google_sign_in: ^6.2.1

  # Apple Login (Pflicht auf iOS, da Google-Login angeboten wird – Guideline 4.8)
  sign_in_with_apple: ^6.1.4
  crypto: ^3.0.3 # SHA256-Nonce für Sign in with Apple

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase Core
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  # <6.7.0: ab 6.7.0 ist WriteBatch.update generisch (withConverter-Support),
  # womit fake_cloud_firestore 4.1.1 nicht kompiliert (Tests brechen).
  # Obergrenze anheben, sobald fake_cloud_firestore > 4.1.1 das nachzieht.
  cloud_firestore: '>=6.4.0 <6.7.0'
  firebase_storage: ^13.0.0

  # Firebase AI - Vertex AI (DSGVO-konform fuer Kinderdaten)
  # Einziger KI-Zugang der App. Alle Calls laufen ueber VertexAIService.
  # ENTFERNT: firebase_vertexai, google_generative_ai, flutter_dotenv
  firebase_ai: ^3.14.0

  # Foto-Upload
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # File system (genutzt in theme_picker_sheet.dart zur LAUFZEIT – nicht dev!)
  path_provider: ^2.1.4
  path: ^1.9.0

  # Splash Screen
  flutter_native_splash: ^2.4.0

  # Crashlytics
  firebase_crashlytics: ^5.0.0

  # UI
  confetti: ^0.7.0
  fl_chart: ^0.69.0
  flutter_markdown: ^0.6.18

  # HTTP
  http: ^1.2.0

  # Code-Generatoren
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_tts: ^3.8.3
  speech_to_text: ^7.0.0

  flutter_math_fork: ^0.7.2

  # File system (genutzt in theme_picker_sheet.dart)
  url_launcher: ^6.3.2
  purchases_flutter: ^9.13.2
  purchases_ui_flutter: ^9.13.2

  # App-Version / Build-Nummer aus dem nativen Bundle lesen (für Feedback-Mails)
  package_info_plus: ^8.1.2

  # Lokalisierung (benötigt für deutschen DatePicker u.a.)
  flutter_localizations:
    sdk: flutter
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # In-Memory Firestore-Fake fuer Unit-Tests (XP-, Streak-, Reward-Logik)
  fake_cloud_firestore: ^4.0.0

  # Code-Generatoren
  build_runner: ^2.4.8
  riverpod_generator: ^2.4.0
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
    - assets/images/